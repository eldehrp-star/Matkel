services:
  - type: web
    name: matkel-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIP_API_KEY
        sync: false
      - key: CLIP_API_BASE_URL
        value: https://api.clip.mx
      - key: CLIP_WEBHOOK_SECRET
        sync: false
      - key: CLIP_WEBHOOK_SIGNATURE_HEADER
        value: x-clip-signature
      - key: SEED_ADMIN_NAME
        value: Administrador
      - key: SEED_ADMIN_USERNAME
        value: admin
      - key: SEED_ADMIN_PIN
        sync: false
      - key: CORS_ORIGIN
        sync: false

  - type: web
    name: matkel-web
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
